<!doctype html>
<html lang="es-PE">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <link rel="shortcut icon" type="image/jpeg" href="/assets/img/logo/logo-hotel.jpg">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/mejoras.css">
    <title>Página no encontrada (404) | Hotel Digital Perú</title>
    <style>
        body {
            background: #0B1B33;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', system-ui, Arial, sans-serif;
            color: #fff;
            text-align: center;
            padding: 2rem;
        }

        .e404 {
            max-width: 560px;
        }

        .e404 h1 {
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #E8C97A, #C9A86A);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .e404 h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0 .5rem;
        }

        .e404 p {
            color: #D6E4F0;
            margin-bottom: 1.8rem;
        }

        .e404 a {
            display: inline-block;
            padding: .8rem 2rem;
            border-radius: 100px;
            font-weight: 800;
            text-decoration: none;
            background: linear-gradient(135deg, #E8C97A, #C9A86A);
            color: #0B1B33;
            margin: 0 .3rem;
        }

        .e404 a.ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .35);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="e404">
        <h1>404</h1>
        <h2>No encontramos esta página</h2>
        <p>La dirección que buscas no existe o cambió de lugar. Vuelve al inicio y sigue explorando el sistema.</p>
        <a href="/">🏠 Ir al inicio</a>
        <a href="/registrar-datos" class="ghost">🎯 Pedir demo gratis</a>
    </div>
</body>

</html>
